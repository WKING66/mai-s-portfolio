# 4c4g 测试环境的同机 HTTPS 入口。
# 只监听回环：浏览器经 SSH 隧道访问 https://localhost:8443 -> 127.0.0.1:443。
# 前端与 API 同源：Nuxt Icon 由 Nitro 提供，业务 API 交给 Spring。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:443 ssl http2;
    server_name localhost 127.0.0.1;

    ssl_certificate     /srv/mai-portfolio/shared/secrets/tls/server.crt;
    ssl_certificate_key /srv/mai-portfolio/shared/secrets/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mai_tls:10m;

    client_max_body_size 128m;
    server_tokens off;

    # 流式问答：关闭缓冲，保证首段正文及时到达浏览器。
    location /api/agent/v1/ {
        proxy_pass http://127.0.0.1:9333;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    # Nuxt Icon 从 Nitro 读取随前端打包的图标集合。
    location ^~ /api/_nuxt_icon/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9333;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
