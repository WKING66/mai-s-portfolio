# 审核后的建议模板：放到 .github/workflows/quality.yml 才会启用。
name: PR quality
"on":
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: portfolio_dev
          # 仅运行器一次性容器；不连接开发或生产 PostgreSQL。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PSQL_HOST: 127.0.0.1
      PSQL_PORT: "5432"
      PSQL_USERNAME: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_KEY_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
      MEDIA_STORAGE: local
      OSS_ACCESS_KEY_ID: ""
      OSS_ACCESS_KEY_SECRET: ""
      RUN_REDIS_INTEGRATION_TEST: "true"
      BLOG_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/blog_document_test_ci
      BLOG_TEST_JDBC_USERNAME: postgres
      BLOG_TEST_JDBC_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "backend/**/pom.xml"
      - name: Prepare isolated test configuration
        shell: bash
        run: |
          owner_password="$(openssl rand -hex 24)"
          echo "::add-mask::$owner_password"
          echo "OWNER_PASSWORD=$owner_password" >> "$GITHUB_ENV"
          echo "PSQL_PASSWORD=$owner_password" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          createdb -h 127.0.0.1 -p 5432 -U postgres blog_document_test_ci
      - name: Backend tests and build (OSS remains a separate authorized acceptance)
        run: mvn -B -f backend/pom.xml -pl mai-portfolio-launch -am verify
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node node_modules/nuxt/bin/nuxt.mjs prepare
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff and new-commit secret check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base="${BASE_SHA:-HEAD^}"
          git diff --check "$base" HEAD
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="$base..HEAD"
