
spring:
  application:
    name: mai_portfolio
  profiles:
    active: dev
  servlet:
    # 文件上传相关配置项
    multipart:
      # 单个文件大小
      max-file-size: 128MB
      # 消息体大小
      max-request-size: 128MB
  datasource:
    druid:
      driver-class-name: org.postgresql.Driver
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 5
      # 最大连接池数量
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 600000
      # 检测间隔
      time-between-eviction-runs-millis: 60000
      # 最小生存的时间
      min-evictable-idle-time-millis: 300000
      # 最大生存的时间
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/*Mapper.xml
#  global-config:
#    db-config:
#      logic-delete-field: deleted
#      logic-not-delete-value: 0
#      logic-delete-value: 1


portfolio:
  bootstrap:
    enabled: true
    initial-password: ${OWNER_PASSWORD:}
  security:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://127.0.0.1:8080}
    login-challenge-ttl: 60s
    max-outstanding-challenges: 128
  media:
    storage: ${MEDIA_STORAGE:local}
    local-directory: ${MEDIA_LOCAL_DIRECTORY:.local-media}
  api-log:
    enabled: ${API_LOG_ENABLED:false}
    max-payload-length: ${API_LOG_MAX_PAYLOAD_LENGTH:2048}
    additional-sensitive-fields: []

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sa-token:
  token-name: portfolio_session
  is-read-header: false
  is-read-body: false
  is-read-cookie: true
  is-print: false
  cookie:
    http-only: true
    same-site: Lax
    secure: false
server:
  port: 9333
