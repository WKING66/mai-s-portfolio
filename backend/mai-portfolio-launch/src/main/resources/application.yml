
server:
  port: 9333

spring:
  application:
    name: mai_portfolio
  profiles:
    # 本地默认使用 dev；部署时必须通过 SPRING_PROFILES_ACTIVE 显式切换环境配置。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    # 文件上传相关配置项
    multipart:
      # 单个文件大小
      max-file-size: 128MB
      # 消息体大小
      max-request-size: 128MB
  datasource:
    druid:
      driver-class-name: org.postgresql.Driver
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 5
      # 最大连接池数量
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 600000
      # 检测间隔
      time-between-eviction-runs-millis: 60000
      # 最小生存的时间
      min-evictable-idle-time-millis: 300000
      # 最大生存的时间
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
  flyway:
    # 全环境统一读取 PostgreSQL 基线，避免非 dev 环境回退到默认 db/migration。
    locations: classpath:db/postgresql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/*Mapper.xml
#  global-config:
#    db-config:
#      logic-delete-field: deleted
#      logic-not-delete-value: 0
#      logic-delete-value: 1

springdoc:
  api-docs:
    enabled: true

portfolio:
  security:
    # 注册与登录分别限流；同一客户端默认每 5 分钟最多提交 5 次注册请求。
    max-registration-attempts-per-client: ${PORTFOLIO_SECURITY_MAX_REGISTRATION_ATTEMPTS_PER_CLIENT:5}
    registration-attempt-window: ${PORTFOLIO_SECURITY_REGISTRATION_ATTEMPT_WINDOW:5m}

logging:
  file:
    # 接口审计日志与应用日志统一进入滚动文件；部署时可用 LOG_FILE 覆盖绝对路径。
    name: ${LOG_FILE:logs/mai-portfolio.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATTERN:logs/mai-portfolio.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: false
  swagger-ui:
    enabled: true

sa-token:
  token-name: portfolio_session
  is-read-header: false
  is-read-body: false
  is-read-cookie: true
  is-print: false
  cookie:
    path: /
    http-only: true
    same-site: Lax
    # 非开发环境默认只允许浏览器经 HTTPS 回传会话 Cookie。
    secure: true
